[plugin]

name="Godot MCP Runtime"
description="Live runtime TCP server (port 4242) + zero-footprint bridge for Godot MCP. Enables general Godot tools (scene/node ops, properties, signals, animation, UI, physics, debugging, screenshots, input simulation, live scripting, etc.) over live runtime control. One-click enable auto-registers the GodotMCPRuntime autoload. Designed for clean projects with no permanent script edits required."
author="Grok + godot-mcp contributors"
version="0.2.1"
script="plugin.gd"
