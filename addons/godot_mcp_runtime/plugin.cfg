[plugin]

name="Godot MCP Runtime"
description="Live runtime TCP server (port 4242) for Godot MCP. Enables general Godot tools (scene/node ops, properties with complex types, signals, animation, UI, physics, debugging, etc.) over live runtime control. One-click enable auto-registers the GodotMCPRuntime autoload."
author="Grok + godot-mcp contributors"
version="0.2.0"
script="plugin.gd"
